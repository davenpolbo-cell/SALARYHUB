
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="login.css"
    >

    <title>Salary Hub - Login</title>

</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <!-- LOGO -->

            <div class="logo-container">

                <img
                    src="logo.png"
                    alt="Salary Hub Logo"
                    class="logo"
                >

            </div>


            <!-- TITLE -->

            <div class="login-header">

                <h1>SALARY HUB</h1>

                <p>
                    Payroll Management System
                </p>

            </div>


            <!-- LOGIN FORM -->

            <div class="login-form">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    autocomplete="username"
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                >


                <button
                    type="button"
                    id="loginBtn"
                >
                    LOGIN
                </button>


                <p
                    id="loginError"
                    class="login-error"
                ></p>

            </div>


            <!-- CREATE ACCOUNT -->

            <div class="create-account">

                <p>
                    Don't have an employee account?
                </p>

                <a href="create_employee.html">
                    Create Employee Account
                </a>

            </div>

        </section>

    </main>


    <script src="login.js"></script>

</body>

</html>
